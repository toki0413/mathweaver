name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend — Python (lint + test)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyproject.toml declares readme = "README.md"; create a stub if the
          # file is absent so the editable install can generate metadata.
          test -f README.md || printf '# MathWeaver Backend\n' > README.md
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Desktop — Electron (typecheck + lint + unit test + coverage + build)
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build (electron-vite)
        run: npx electron-vite build

  # ---------------------------------------------------------------------------
  # Desktop E2E — Playwright (browser-based integration tests)
  # ---------------------------------------------------------------------------
  desktop-e2e:
    name: Desktop E2E (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: desktop/test-results/
          retention-days: 7
