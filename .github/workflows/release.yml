name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Gate: ensure CI passes before building release artifacts
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate (quality + E2E + a11y)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Type check
        working-directory: desktop
        run: npm run typecheck

      - name: Lint
        working-directory: desktop
        run: npm run lint

      - name: Format check
        working-directory: desktop
        run: npm run format:check

      - name: Unit tests with coverage
        working-directory: desktop
        run: npm run test:coverage

      - name: Build (electron-vite)
        working-directory: desktop
        run: npx electron-vite build

      # --- E2E tests (blocking) ---
      - name: Install Playwright browsers
        working-directory: desktop
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: desktop
        run: npx playwright test

      - name: Run accessibility audit
        working-directory: desktop
        run: npx playwright test tests/e2e/accessibility.spec.ts --reporter=html

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-e2e-results
          path: desktop/test-results/
          retention-days: 7

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-a11y-report
          path: desktop/playwright-report/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Build desktop installers on each platform
  # ---------------------------------------------------------------------------
  build:
    needs: ci-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: MathWeaver-*-x86_64.AppImage
            cache-key: linux
          - os: windows-latest
            platform: win
            artifact: MathWeaver Setup *.exe
            cache-key: windows
          - os: macos-latest
            platform: mac
            artifact: MathWeaver-*.dmg
            cache-key: macos

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npx electron-vite build

      # --- Code Signing (conditional on secrets) ---
      # Windows: signs the NSIS installer when CSC_LINK is set
      # macOS: signs + notarizes when CSC_LINK + APPLE_ID are set
      - name: Package (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing (EV or OV certificate)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Team ID for macOS notarization
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathweaver-${{ matrix.platform }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Attach artifacts to GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/mathweaver-win/*
            artifacts/mathweaver-mac/*
            artifacts/mathweaver-linux/*
          fail_on_unmatched_files: false
