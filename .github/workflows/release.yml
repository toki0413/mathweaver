name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Gate: ensure CI passes before building release artifacts
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate (ensure quality checks pass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Type check
        working-directory: desktop
        run: npm run typecheck

      - name: Lint
        working-directory: desktop
        run: npm run lint

      - name: Format check
        working-directory: desktop
        run: npm run format:check

      - name: Unit tests
        working-directory: desktop
        run: npm run test

      - name: Build (electron-vite)
        working-directory: desktop
        run: npx electron-vite build

  # ---------------------------------------------------------------------------
  # Build desktop installers on each platform
  # ---------------------------------------------------------------------------
  build:
    needs: ci-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: MathWeaver-*-x86_64.AppImage
            cache-key: linux
          - os: windows-latest
            platform: win
            artifact: MathWeaver Setup *.exe
            cache-key: windows
          - os: macos-latest
            platform: mac
            artifact: MathWeaver-*.dmg
            cache-key: macos

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npx electron-vite build

      - name: Package (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathweaver-${{ matrix.platform }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Attach artifacts to GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/mathweaver-win/*
            artifacts/mathweaver-mac/*
            artifacts/mathweaver-linux/*
          fail_on_unmatched_files: false
