appId: com.mathweaver.app
productName: MathWeaver
copyright: Copyright © 2026 MathWeaver Team
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: release

# electron-builder automatically includes all `dependencies` from package.json
# and rebuilds native modules (e.g. better-sqlite3) for the target platform.
# devDependencies are excluded. Everything is packed into app.asar.
asar: true

files:
  - out/**/*
  - package.json
  - "!**/*.{ts,tsx,map}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"

# Ensure native modules are rebuilt for Electron's ABI
npmRebuild: true

# Code signing configuration
# For production builds, set these environment variables:
#   Windows: CSC_LINK (path to .pfx), CSC_KEY_PASSWORD
#   macOS:   CSC_LINK (path to .p12),  CSC_KEY_PASSWORD
#   Or use:  WIN_CSC_LINK, CSC_NAME (for macOS keychain)
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: MathWeaver
  uninstallDisplayName: MathWeaver
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.education

dmg:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  sign: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.png
  category: Education

appImage:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Auto-update: publish to GitHub Releases
publish:
  - provider: github
    owner: toki0413
    repo: mathweaver
    releaseType: release

# Generate latest.yml / latest-mac.yml / latest-linux.yml
generateUpdatesFilesForAllChannels: true
