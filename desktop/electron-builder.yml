appId: com.mathweaver.app
productName: MathWeaver
copyright: Copyright © 2026 MathWeaver Team
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - "!**/*.{ts,tsx,map}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"

extraResources:
  - from: ../backend
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/.pytest_cache/**"
      - "!**/tests/**"
      - "!**/*.egg-info/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: MathWeaver
  uninstallDisplayName: MathWeaver
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.education

dmg:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Education

appImage:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

publish:
  - provider: github
    owner: toki0413
    repo: mathweaver
