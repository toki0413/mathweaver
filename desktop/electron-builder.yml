appId: com.mathweaver.app
productName: MathWeaver
copyright: Copyright © 2026 MathWeaver Team
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: release

# electron-builder automatically includes all `dependencies` from package.json
# and rebuilds native modules (e.g. better-sqlite3) for the target platform.
# devDependencies are excluded. Everything is packed into app.asar.
asar: true

# Extra files to include alongside the app bundle.
# The local webgazer.js script is bundled so eye-tracking works offline.
# webgazer 3.x loads its face_mesh detection assets via the relative path
# `./mediapipe/face_mesh/`, so those must live next to the script in the
# `webgazer/` extraResources directory.
extraResources:
  - from: node_modules/webgazer/dist/webgazer.js
    to: webgazer/webgazer.all.js
    filter: ["**/*"]
  - from: node_modules/webgazer/dist/mediapipe
    to: webgazer/mediapipe
    filter: ["**/*"]

files:
  - out/**/*
  - package.json
  - "!**/*.{ts,tsx,map}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"

# Ensure native modules are rebuilt for Electron's ABI
npmRebuild: true

# ---------------------------------------------------------------------------
# Code signing configuration
# ---------------------------------------------------------------------------
# Set these environment variables for production builds:
#
#   macOS (Apple Developer certificate):
#     CSC_LINK       = path to .p12 file (or base64-encoded contents)
#     CSC_KEY_PASSWORD = .p12 file password
#     APPLE_ID       = Apple Developer account email (for notarization)
#     APPLE_APP_SPECIFIC_PASSWORD = app-specific password (notarization)
#
#   Windows (code signing certificate):
#     CSC_LINK       = path to .pfx file
#     CSC_KEY_PASSWORD = .pfx file password
#
#   If CSC_LINK is unset, builds are produced unsigned (for development only).
#   Unsigned macOS builds will be blocked by Gatekeeper; users must right-click
#   → Open to bypass, or run: xattr -cr /Applications/MathWeaver.app
# ---------------------------------------------------------------------------

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: MathWeaver
  uninstallDisplayName: MathWeaver
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.education
  # Notarization: when APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD are set,
  # electron-builder automatically submits the build for notarization.
  # Gatekeeper will then accept the app without user intervention.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  sign: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.png
  category: Education
  # AppImage needs chrome-sandbox to have setuid root. Two options:
  #   1. Build with --no-sandbox (less secure, but portable).
  #   2. Run: sudo chmod 4755 chrome-sandbox inside the extracted AppImage.
  # electron-builder sets the correct permissions automatically when building
  # on Linux. Users running the AppImage on systems where setuid is restricted
  # can launch with: ./MathWeaver-*.AppImage --no-sandbox

appImage:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Auto-update: publish to GitHub Releases
publish:
  - provider: github
    owner: toki0413
    repo: mathweaver
    releaseType: release

# Generate latest.yml / latest-mac.yml / latest-linux.yml
generateUpdatesFilesForAllChannels: true
