[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathweaver"
version = "0.1.0"
description = "MathWeaver - Multi-Agent Cognitive Operating System for Math Education"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "z3-solver>=4.13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# Gate the whole `mathweaver` package. Only modules that require an external
# runtime (Manim for animation rendering, an MCP broker for the server) are
# omitted so their absence doesn't mask regressions in the testable core.
source = ["mathweaver"]
omit = [
    "mathweaver/animation/*",   # requires Manim + external renderer
    "mathweaver/mcp_server/*",  # requires an MCP broker/transport
]

[tool.coverage.report]
# Industrial production gate: the suite must maintain ≥75% statement coverage.
# Raisable as more integration tests land.
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
