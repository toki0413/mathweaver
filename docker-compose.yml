# MathWeaver — local development / demo stack.
#
# Usage:
#   cp backend/.env.example backend/.env   # configure your LLM key (or use mock)
#   docker compose up --build
#
# This runs the optional Python FastAPI backend (dev mode).
# The UI is the desktop/ Electron app — run it with:  cd desktop && npm install && npm run dev
#
# Backend:  http://localhost:8000

services:
  backend:
    build: ./backend
    container_name: mathweaver-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Persist the SQLite database inside the mounted volume.
      MATHWEAVER_DB_PATH: /app/data/mathweaver.db
      MATHWEAVER_HOST: "0.0.0.0"
      MATHWEAVER_PORT: "8000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
